name: Scrape Forex News Calendar

on:
  schedule:
    # Runs every hour at minute 0 for timely economic release syncing
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow manual runs from the GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set Timezone to Match Runner IP Location
        run: |
          TZ=$(curl -s ipinfo.io/timezone)
          echo "Setting OS timezone to $TZ to match Forex Factory's IP Geolocation"
          sudo timedatectl set-timezone $TZ

      - name: Install System Dependencies (Chrome & ChromeDriver)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          cd scraper
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper and Enrich Pipeline
        run: |
          cd scraper
          # Run scraper (graceful fallback if FF has temporary anti-bot or network hiccups)
          python scraper.py scrape --config config.yaml --months this next || echo "⚠️ Scraper finished with notice, continuing pipeline..."
          # Generate latest news.json
          python generate_news_json.py
          # Ensure full enrichment with dynamic UTC cutoff so all released events have actuals
          python enrich_events.py

      - name: Sync News Data to App Assets
        run: |
          if [ -f "scraper/news.json" ]; then
            mkdir -p app/app/src/main/assets
            cp scraper/news.json app/app/src/main/assets/news.json
            echo "Synced news.json to app/app/src/main/assets/news.json"
          fi

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated sync: Update news calendar data & actual releases"

      - name: Purge JSDelivr Cache
        run: |
          curl -s https://purge.jsdelivr.net/gh/VenomxTeam/Forex-News@main/scraper/news.json
          curl -s https://purge.jsdelivr.net/gh/VenomxTeam/Forex-News@main/app/app/src/main/assets/news.json

