name: Automated FCM Push Dispatcher

on:
  schedule:
    # Runs every 5 minutes for timely economic alerts (T-30m, T-15m, T+5m wrap, session opens)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_test:
        description: 'Force immediate retention test alert'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dispatch_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin requests

      - name: Run FCM Push Dispatcher (Zero Fake, Zero Spam)
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          cd scraper
          if [ "${{ inputs.force_test }}" = "true" ]; then
            python fcm_push_dispatcher.py --force-retention
          else
            python fcm_push_dispatcher.py
          fi

      - name: Commit Deduplication History
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync: Record sent push notification state"
          file_pattern: "scraper/state/sent_push_history.json"
